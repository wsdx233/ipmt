[package]
name = "ipmt"
version = "0.1.0"
edition = "2024"
description = "A fast TUI editor for pi and omp model lists"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
fuzzy-matcher = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tempfile = "3.20"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
